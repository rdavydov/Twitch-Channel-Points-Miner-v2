name: Dashboard checks

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'TwitchChannelPointsMiner/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/dashboard-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q

  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Verify packaged frontend
        run: |
          python -m pip wheel --no-deps . -w /tmp/dashboard-wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('/tmp/dashboard-wheels').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              assert 'TwitchChannelPointsMiner/dashboard/static/index.html' in names
              assert any(n.endswith('.woff2') for n in names)
          PY
